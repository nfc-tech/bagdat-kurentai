<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<title>Bagdat Kurentay — Performance Marketer</title>
<meta name="description" content="Digital business card of Bagdat Kurentay, Performance Marketer at Baipket." />
<meta property="og:title" content="Bagdat Kurentay — Performance Marketer" />
<meta property="og:description" content="Digital business card of Bagdat Kurentay, Performance Marketer at Baipket." />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#050505;
  --bg-secondary:#0b0b0c;
  --red-blood:#8b0000;
  --red-accent:#e31b23;
  --red-dark:#3a0000;
  --text-primary:#f5f5f5;
  --text-secondary:#a8a8ad;
  --border-color:rgba(255,255,255,0.10);
  --btn-gradient:linear-gradient(110deg,#8b0000 0%,#5a0000 24%,#260000 55%,#090909 82%,#020202 100%);
  --font-display:"Manrope","Inter",system-ui,-apple-system,sans-serif;
  --font-body:"Inter","Manrope",system-ui,-apple-system,sans-serif;
  --ease-reveal:cubic-bezier(0.22,1,0.36,1);
  --container-max:780px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg-primary);color:var(--text-primary);overflow-x:hidden;}
body{font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
:focus-visible{outline:2px solid var(--red-accent);outline-offset:3px;border-radius:4px;}
.page{position:relative;min-height:100vh;display:flex;justify-content:center;padding:0 16px 56px;background:var(--bg-primary);background-image:radial-gradient(rgba(255,255,255,0.025) 1px,transparent 1px);background-size:3px 3px;}
.glow{position:fixed;pointer-events:none;z-index:0;filter:blur(80px);opacity:0.35;}
.glow--top{top:-10%;left:50%;width:480px;height:380px;transform:translateX(-50%);background:radial-gradient(circle,rgba(139,0,0,0.5) 0%,rgba(139,0,0,0) 70%);}
.glow--bottom{bottom:-12%;left:20%;width:420px;height:380px;background:radial-gradient(circle,rgba(227,27,35,0.28) 0%,rgba(227,27,35,0) 70%);}
.card{position:relative;z-index:1;width:100%;max-width:var(--container-max);padding-top:28px;}
.hero{width:100%;}
.hero__photo-wrap{position:relative;width:100%;aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:var(--bg-secondary);opacity:0;transform:scale(1.03);transition:opacity 900ms var(--ease-reveal),transform 900ms var(--ease-reveal);}
.hero__photo-wrap--loaded{opacity:1;transform:scale(1);}
.hero__photo{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform 120ms linear;will-change:transform;}
.hero__mask{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,5,0) 55%,rgba(5,5,5,0.55) 82%,var(--bg-primary) 100%);pointer-events:none;}
.info{margin-top:-34px;padding:0 6px;position:relative;z-index:2;}
.info__name{margin:0;font-family:var(--font-display);font-size:clamp(36px,8vw,68px);font-weight:750;letter-spacing:-0.04em;line-height:1.02;color:var(--text-primary);border-left:3px solid var(--red-accent);padding-left:14px;overflow-wrap:break-word;}
.info__role{margin:10px 0 0;padding-left:17px;font-family:var(--font-display);font-size:clamp(16px,3.6vw,19px);font-weight:600;color:var(--red-accent);letter-spacing:-0.01em;}
.info__company{margin:10px 0 0;padding-left:17px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-secondary);font-weight:500;}
.info__company svg{color:var(--red-accent);flex-shrink:0;}
.section-header{display:flex;align-items:center;gap:14px;margin:30px 0 14px;padding:0 6px;}
.section-header__label{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:0.22em;color:var(--text-secondary);white-space:nowrap;}
.section-header__rule{flex:1;height:1px;background:linear-gradient(90deg,var(--red-accent) 0%,var(--border-color) 60%,transparent 100%);opacity:0.6;}
.links-group{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
.link-btn{position:relative;display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 18px;border-radius:18px;background:var(--btn-gradient);border:1px solid var(--border-color);overflow:hidden;cursor:pointer;transition:transform 220ms var(--ease-reveal),border-color 220ms ease,box-shadow 220ms ease;box-shadow:0 0 0 rgba(227,27,35,0);}
.link-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.22);box-shadow:0 8px 28px rgba(227,27,35,0.22);}
.link-btn:active{transform:translateY(0) scale(0.98);}
.link-btn__shimmer{content:"";position:absolute;inset:0;width:55%;transform:translateX(-170%) skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),rgba(255,40,40,0.26),rgba(255,255,255,0.12),transparent);animation:buttonShimmer 2.8s linear infinite;animation-delay:var(--delay,0ms);will-change:transform;pointer-events:none;}
@keyframes buttonShimmer{0%{transform:translateX(-170%) skewX(-20deg);}100%{transform:translateX(220%) skewX(-20deg);}}
.link-btn__icon{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex-shrink:0;border-radius:12px;background:rgba(255,255,255,0.06);color:var(--text-primary);transition:transform 220ms var(--ease-reveal);}
.link-btn:hover .link-btn__icon{transform:scale(1.08);}
.link-btn__text{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.link-btn__title{font-family:var(--font-display);font-size:15.5px;font-weight:700;color:var(--text-primary);letter-spacing:-0.01em;}
.link-btn__subtitle{font-size:13px;font-weight:500;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-btn__arrow{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);flex-shrink:0;transition:transform 220ms var(--ease-reveal),color 220ms ease;}
.link-btn:hover .link-btn__arrow{transform:translateX(3px);color:var(--text-primary);}
.footer-tagline{margin:40px 0 0;padding:0 6px;text-align:center;font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:0.2em;color:var(--text-secondary);}
.footer-tagline__dot{color:var(--red-accent);margin:0 8px;}
.reveal{opacity:0;transform:translateY(24px);filter:blur(8px);transition:opacity 700ms var(--ease-reveal),transform 700ms var(--ease-reveal),filter 700ms var(--ease-reveal);transition-delay:var(--delay,0ms);will-change:opacity,transform,filter;}
.reveal--visible{opacity:1;transform:translateY(0);filter:blur(0);}
@media (min-width:431px){.page{padding-left:18px;padding-right:18px;}}
@media (min-width:768px){.card{padding-top:40px;}.link-btn{padding:14px 22px;}}
@media (min-width:1024px){.page{align-items:flex-start;}.card{padding-top:64px;}}
@media (prefers-reduced-motion:reduce){
  .hero__photo-wrap{transition:none;opacity:1;transform:none;}
  .hero__photo{transition:none;transform:none !important;}
  .link-btn__shimmer{display:none;}
  .reveal{transition:none;opacity:1;transform:none;filter:none;}
  .link-btn,.link-btn__icon,.link-btn__arrow{transition:none;}
}
</style>
</head>

<script>
// ---------- icons (inline SVG strings, no external deps) ----------
const ICONS = {
  instagram: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>',
  whatsapp: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
  telegram: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
  arrow: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>'
};

// ---------- data ----------
const contacts = [
  { title: "Instagram", subtitle: "@kurentay8", href: "https://www.instagram.com/kurentay8?igsh=MXd6Y3lybHlhNmZ4OQ==", icon: "instagram", aria: "Open Bagdat Kurentay's Instagram profile in a new tab" },
  { title: "WhatsApp", subtitle: "+7 771 125 0509", href: "https://wa.me/77711250509", icon: "whatsapp", aria: "Message Bagdat Kurentay on WhatsApp" },
  { title: "Telegram", subtitle: "@Kurentay8", href: "https://t.me/Kurentay8", icon: "telegram", aria: "Open Bagdat Kurentay's Telegram in a new tab" }
];

const projects = [
  { title: "Baipket", subtitle: "@baipket", href: "https://www.instagram.com/baipket?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==", icon: "instagram", aria: "Open Baipket's Instagram profile in a new tab" },
  { title: "Casto Home", subtitle: "@casto_home", href: "https://www.instagram.com/casto_home?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==", icon: "instagram", aria: "Open Casto Home's Instagram profile in a new tab" },

];

const exMarketer = [
  { title: "125online_kz", subtitle: "@125online_kz", href: "https://www.instagram.com/125online_kz?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==", icon: "instagram", aria: "Open 125online_kz's Instagram profile in a new tab" }
];

// ---------- render link buttons ----------
function renderGroup(containerId, items, baseDelay, stagger) {
  const container = document.getElementById(containerId);
  items.forEach((item, index) => {
    const wrap = document.createElement("div");
    wrap.className = "reveal";
    wrap.style.setProperty("--delay", (baseDelay + index * stagger) + "ms");

    const a = document.createElement("a");
    a.className = "link-btn";
    a.href = item.href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.setAttribute("aria-label", item.aria);
    a.style.setProperty("--delay", (index * 350) + "ms");

    a.innerHTML =
      '<span class="link-btn__shimmer" aria-hidden="true"></span>' +
      '<span class="link-btn__icon">' + ICONS[item.icon] + '</span>' +
      '<span class="link-btn__text">' +
        '<span class="link-btn__title">' + item.title + '</span>' +
        '<span class="link-btn__subtitle">' + item.subtitle + '</span>' +
      '</span>' +
      '<span class="link-btn__arrow" aria-hidden="true">' + ICONS.arrow + '</span>';

    wrap.appendChild(a);
    container.appendChild(wrap);
  });
}

renderGroup("contactsGroup", contacts, 140, 90);
renderGroup("projectsGroup", projects, 70, 90);
renderGroup("exMarketerGroup", exMarketer, 70, 90);

// ---------- scroll reveal (Intersection Observer, animate once) ----------
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      entry.target.classList.add("reveal--visible");
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.2, rootMargin: "0px 0px -8% 0px" });

document.querySelectorAll(".reveal").forEach((el) => revealObserver.observe(el));

// ---------- hero photo load-in ----------
const heroPhoto = document.getElementById("heroPhoto");
const heroPhotoWrap = document.getElementById("heroPhotoWrap");
function markLoaded() { heroPhotoWrap.classList.add("hero__photo-wrap--loaded"); }
if (heroPhoto.complete) {
  markLoaded();
} else {
  heroPhoto.addEventListener("load", markLoaded);
}

// ---------- light parallax on precise-pointer devices, respects reduced motion ----------
const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const hasFinePointer = window.matchMedia("(pointer: fine)").matches;

if (!prefersReduced && hasFinePointer) {
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const rect = heroPhotoWrap.getBoundingClientRect();
      const progress = rect.top / window.innerHeight;
      const clamped = Math.max(-1, Math.min(1, progress));
      heroPhoto.style.transform = "translateY(" + (clamped * -12) + "px)";
      ticking = false;
    });
  }, { passive: true });
}
